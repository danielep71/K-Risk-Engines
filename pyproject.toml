# Quality settings for the hub's Python scripts in .github/scripts. The scripts
# and tests need only the standard library (plus PyYAML for the workflow
# tests, from .github/requirements.txt). Ruff and mypy are CI and development
# tools, installed from tools/requirements-quality-ci.txt. Adapted from
# danielep71/MyTemplate (see NOTICE.md).

[tool.ruff]
target-version = "py311"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.11"
files = [".github/scripts"]
pretty = true
show_error_codes = true
warn_unused_configs = true
strict = true

# The workflow tests read YAML with PyYAML, which ships without type stubs;
# treat it as untyped rather than add a stub package to the locked tools.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
