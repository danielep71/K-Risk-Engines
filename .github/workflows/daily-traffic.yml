# ---------------------------------------------------------------------------
# Daily traffic export
#
#   Reads the GitHub traffic API for this repository and merges a daily
#   snapshot into CSV files on the data-only `traffic-history` branch, with
#   .github/scripts/traffic_history.py (tested in test_traffic_history.py):
#   the newest observation of each date wins and merging a collection twice
#   changes nothing. It rewrites data/badges/clones.json, visitors.json and
#   visits.json there: the shields.io endpoints behind the README's clones,
#   visitors and visits badges. The branch must exist: the workflow checks it out and never
#   creates or recreates it.
#
#   traffic-history exception
#     Unlike a data-only branch created by this workflow, this repository's
#     branch was initialized from `main` at 85159f7 (commit 1b6d86d), so its
#     history is shared with `main`. It is kept as it is: never recreated,
#     rewritten or merged into `main` (docs/TRAFFIC.md).
#
#   Data retention
#     GitHub retains traffic data for 14 days only. This workflow exists to
#     keep a longer history. The `traffic-history` branch is visible to anyone
#     who can read this repository, and the data it holds (view counts, clone
#     counts, referrers, popular paths) is the same aggregate data GitHub
#     already exposes to repository admins. It contains no identifying
#     information about individual visitors.
#
#   Credentials
#     The traffic API requires `Administration: read` on this repository. The
#     fetch step uses a short-lived installation token of a dedicated GitHub
#     App that has only that permission. The App's client ID is the
#     environment variable TRAFFIC_APP_CLIENT_ID and its private key the
#     environment secret TRAFFIC_APP_PRIVATE_KEY, both in the repository-level
#     `analytics` environment. The token expires after an hour and is revoked
#     at the end of the job, so it needs no rotation.
#     That environment is not a workflow-identity boundary: any job declaring
#     it may request access, subject to the configured environment protections.
#
#     Rotate the App's private key immediately if this workflow is modified
#     by someone other than the maintainer. See docs/TRAFFIC.md.
#
#   Jobs
#     collect  `analytics` environment, contents: write. Checks the App
#              configuration, fetches the API with the App token (curl retries
#              transient errors), merges with the default branch's reviewed
#              merge script and pushes to traffic-history. No checkout keeps
#              credentials: the workflow token reaches only the push step, which
#              retries up to three times, refetching and re-merging the branch
#              if another writer moved it, and never force-pushes.
#     alert    No environment, issues: write. Opens an alert issue on a
#              traffic spike, more stars or forks, or a new referrer.
#
#   Scope
#     This is repository analytics. It is not CI. Beyond its own merge script
#     it runs no repository code or tests, and must never be extended to do
#     so. Software quality is website-checks.yml, deliberately separate so
#     that a high-privilege analytics token is never available to a job that
#     executes repository code. It runs only from the default branch.
# ---------------------------------------------------------------------------

name: Daily traffic export

on:
  schedule:
    # Off the hour, when GitHub's scheduler is less loaded.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege. Write grants are scoped to one job each:
#   collect  contents: write  pushes the CSV history to traffic-history
#   alert    issues:   write  opens an alert issue
# Nothing else is granted.
permissions:
  contents: read

concurrency:
  group: daily-traffic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    name: Export GitHub traffic
    # Manual dispatch can select any branch. Run only the default branch's
    # reviewed copy; scheduled events already run on the default branch.
    # Configure the analytics environment to allow only main before adding its
    # secret; see docs/TRAFFIC.md.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    # Requests the repository-level analytics environment. Keep this declaration
    # out of every code-executing build, test and release job; the environment
    # name alone does not bind the secret to this workflow identity.
    environment: analytics

    steps:
      - name: Check out the default branch
        # v7.0.1 - pinned to a full commit SHA so a moved tag cannot change what runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false

      - name: Check out traffic-history
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: traffic-history
          path: history
          persist-credentials: false

      - name: Check the traffic App configuration
        # Fails early with a clear message; the key itself never reaches this step.
        shell: bash
        env:
          CLIENT_ID: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::TRAFFIC_APP_CLIENT_ID or TRAFFIC_APP_PRIVATE_KEY is not set in the analytics environment (docs/TRAFFIC.md)"
            exit 1
          fi

      - name: Create traffic App token
        id: app-token
        # v3.3.0 - pinned to a full commit SHA so a moved tag cannot change what runs
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Fetch GitHub traffic API data
        id: fetch
        shell: bash
        env:
          TRAFFIC_API_TOKEN: ${{ steps.app-token.outputs.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          set -euo pipefail

          RAW="$RUNNER_TEMP/raw"
          mkdir -p "$RAW"
          # The collection time, recorded before the first request.
          echo "collected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # curl retries timeouts and HTTP 408, 429, 500, 502, 503 and 504,
          # honouring Retry-After; any other failure stops the run before a merge.
          api_get() {
            local label="$1" path="$2" output="$3"
            curl --silent --show-error --location --fail-with-body \
              --retry 5 --retry-max-time 300 --max-time 60 \
              --header "Authorization: Bearer $TRAFFIC_API_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$RAW/$output" \
              "$API$path" \
              || { echo "::error::$label request failed"; head -c 2000 "$RAW/$output" 2>/dev/null || true; exit 1; }
          }

          api_get "Page views" "/traffic/views?per=day" views.json
          api_get "Clones" "/traffic/clones?per=day" clones.json
          api_get "Top referrers" "/traffic/popular/referrers" referrers.json
          api_get "Popular paths" "/traffic/popular/paths" paths.json
          api_get "Repository metadata" "" repo.json

      - name: Merge the collection into the history
        shell: bash
        env:
          COLLECTED_AT: ${{ steps.fetch.outputs.collected_at }}
        run: >-
          python3 source/.github/scripts/traffic_history.py merge
          --raw "$RUNNER_TEMP/raw"
          --data history/data
          --collected-at "$COLLECTED_AT"

      - name: Commit and push traffic history
        # The workflow token reaches only this step, as an HTTP header for the
        # push and fetch below; no checkout keeps credentials.
        working-directory: history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTED_AT: ${{ steps.fetch.outputs.collected_at }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }

          # set -e does not apply inside a function called from a || list, so
          # each git command checks its own status. 3 means "nothing to commit".
          commit() {
            git add data || return 1
            if git diff --cached --quiet; then
              echo "No traffic changes to commit"
              return 3
            fi
            git commit --quiet -m "Update traffic history" || return 1
          }
          record() {
            status=0
            commit || status=$?
            if [ "$status" -eq 3 ]; then
              exit 0
            elif [ "$status" -ne 0 ]; then
              echo "::error::Could not commit the traffic history"
              exit "$status"
            fi
          }

          record
          for attempt in 1 2 3; do
            if git_auth push origin HEAD:traffic-history; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            # Another writer moved the branch: rebuild this collection on its
            # new tip instead of overwriting it; never force-push.
            sleep $((attempt * 10))
            git_auth fetch origin traffic-history
            git reset --hard FETCH_HEAD
            python3 ../source/.github/scripts/traffic_history.py merge \
              --raw "$RUNNER_TEMP/raw" --data data --collected-at "$COLLECTED_AT"
            record
          done
          echo "::error::Could not push the traffic history after 3 attempts"
          exit 1

  alert:
    name: Traffic alert
    needs: collect
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No environment: this job never receives the App's credentials.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Check out traffic-history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-history
          path: history
          persist-credentials: false

      - name: Open the alert issue, if one is due
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          milestone_title="Traffic monitoring"
          milestones_api="repos/$GH_REPO/milestones"
          # Look at open and closed milestones: titles are unique across both,
          # so creating one that exists only as closed would be rejected.
          row="$(gh api --paginate "$milestones_api?state=all&per_page=100" \
            --jq ".[] | select(.title == \"$milestone_title\") | [.number, .state, ((.due_on // \"\")[0:10])] | @tsv")"
          number="" state="" due=""
          if [ -n "$row" ]; then
            IFS=$'\t' read -r number state due <<< "$row"
          fi
          # Issue triage requires a milestone due date: give a new or undated
          # milestone the end of the year after next.
          set_due=""
          if [ -z "$due" ]; then
            due="$(( $(date -u +%Y) + 2 ))-12-31"
            set_due=1
          fi

          alert="$RUNNER_TEMP/alert.json"
          python3 source/.github/scripts/traffic_history.py alert \
            --data history/data ${due:+--milestone-due "$due"} --output "$alert"
          [ -f "$alert" ] || exit 0
          title="$(jq -r .title "$alert")"
          jq -j .body "$alert" > "$RUNNER_TEMP/alert.md"

          # An alert for that date already exists (open or closed): leave it,
          # and its milestone, as they are.
          existing="$(gh issue list --state all --search "\"$title\" in:title" \
            --json title --jq "map(select(.title == \"$title\")) | length")"
          if [ "$existing" != "0" ]; then
            echo "Alert issue already exists: $title"
            exit 0
          fi

          # Keep analytics alerts assigned, prioritised and grouped separately.
          if [ -z "$number" ]; then
            gh api --method POST "$milestones_api" -f title="$milestone_title" \
              -f description="Review repository traffic alerts and trends." \
              -f due_on="${due}T08:00:00Z" > /dev/null
          else
            # Reopen it: alerts belong in an open milestone, and gh issue
            # create may not resolve a closed milestone by title.
            if [ "$state" != "open" ]; then
              gh api --method PATCH "$milestones_api/$number" -f state=open > /dev/null
            fi
            if [ -n "$set_due" ]; then
              gh api --method PATCH "$milestones_api/$number" -f due_on="${due}T08:00:00Z" > /dev/null
            fi
          fi

          gh issue create --title "$title" --body-file "$RUNNER_TEMP/alert.md" \
            --assignee danielep71 --label P3 --label repository --milestone "$milestone_title"
