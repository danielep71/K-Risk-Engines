name: Daily portfolio refresh

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Pull requests opened with GITHUB_TOKEN wait for a maintainer to approve
    # their workflow runs. The proposal is therefore pushed and opened with a
    # short-lived GitHub App token, so Website checks run without approval.
    # The code-review bot skips bot-authored pull requests; the maintainer's
    # review before merging is the only review of a proposal.
    # The refresh itself reads public evidence with the read-only GITHUB_TOKEN
    # in its step; the App token is created only after those checks pass.
    # Steps share a runner/workspace: this is credential scoping, not an
    # isolation boundary. See docs/PORTFOLIO_AUTOMATION.md.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds PORTFOLIO_APP_CLIENT_ID and PORTFOLIO_APP_PRIVATE_KEY; deployment
    # branches are restricted to main.
    environment: portfolio-refresh
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: automation/portfolio-refresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh proposal branch
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Reuse the branch only while its proposal PR is open. Otherwise rebuild it
          # from main: a branch left by a closed, unmerged proposal is replaced in
          # the push step (deleted, then pushed again), never force-pushed.
          open_pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          stale=false
          if [ -n "$open_pr" ] && git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch --track "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              stale=true
            fi
            git switch -c "$BRANCH"
          fi
          python3 .github/scripts/portfolio-refresh.py --body-file "$RUNNER_TEMP/portfolio-pr.md"
          python3 .github/scripts/check-website.py
          python3 .github/scripts/check-website.py --external
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          git add README.md index.html docs/PORTFOLIO_STATUS.md docs/portfolio-state.json
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh portfolio status from project evidence'
            changed=true
          fi
          if git diff --quiet origin/main HEAD -- README.md index.html docs/PORTFOLIO_STATUS.md docs/portfolio-state.json; then
            echo 'No portfolio changes to propose.' >> "$GITHUB_STEP_SUMMARY"
            echo 'propose=false' >> "$GITHUB_OUTPUT"
          else
            echo 'propose=true' >> "$GITHUB_OUTPUT"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
      - name: Create GitHub App token
        id: app-token
        if: steps.refresh.outputs.propose == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PORTFOLIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push proposal and open or update its pull request
        if: steps.refresh.outputs.propose == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGED: ${{ steps.refresh.outputs.changed }}
          STALE: ${{ steps.refresh.outputs.stale }}
        run: |
          set -euo pipefail
          if [ "$STALE" = true ]; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" --delete "$BRANCH"
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$BRANCH"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --base main --title 'docs: refresh portfolio status and milestone progress' --body-file "$RUNNER_TEMP/portfolio-pr.md" --assignee danielep71 --label documentation --label P3
          elif [ "$CHANGED" = true ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/portfolio-pr.md"
          fi
          gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url' >> "$GITHUB_STEP_SUMMARY"
