name: Website checks

# "HTML and links" is a required check on main and release/**. Every event runs
# the script tests and the local HTML, Markdown, asset and anchor checks.
# External links are fetched only on trusted events (pushes, the weekly schedule
# and manual runs), not on pull requests. Read-only token; no secrets.

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: HTML and links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test website check and portfolio refresh rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check HTML, Markdown links, assets and internal anchors
        run: python3 .github/scripts/check-website.py
      - name: Check external links on trusted events
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/check-website.py --external
