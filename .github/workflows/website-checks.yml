name: Website checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: HTML and links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check HTML structure, assets and internal links
        run: python3 .github/scripts/check-website.py
      - name: Check external links on trusted events
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/check-website.py --external
