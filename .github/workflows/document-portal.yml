name: Document portal

# Builds the documentation portal with both builders (Zensical and Material for
# MkDocs) from the same input, checks links, URL inventories and source hashes,
# and keeps both complete Pages candidates as artifacts. Every candidate holds
# the unchanged static website plus the portal under /documentation/.
#
# Only pushes to the default branch and manual runs on it publish. They deploy
# the complete Zensical candidate; a manual run can choose the Material
# candidate instead, to roll back the builder without a code change. The
# compare job is read-only; only the deploy job may write Pages, with the
# github-pages environment. Deploy jobs share one concurrency group: one runs,
# and of those waiting only the newest is kept. A deploy publishes only if its
# commit is still the head of the default branch, so an older run that finishes
# late cannot replace a newer site; it skips and says so. The deploy job also
# skips, with a warning, unless the Pages source is "GitHub Actions"
# (docs/REPOSITORY_SETTINGS.md).

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      builder:
        description: Candidate to publish from the default branch
        type: choice
        options:
          - zensical
          - mkdocs
        default: zensical

permissions:
  contents: read

concurrency:
  # A new commit on a pull request cancels the run of the commit it replaces;
  # every other run has a group of its own.
  group: document-portal-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install hash-locked builders
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-portal.txt
      - name: Build with both builders and complete Pages candidates
        run: python tools/portal/build.py
      - name: Exercise broken-link rejection
        run: python tools/portal/test_portal.py
      - name: Compare paths and check links and stale references
        run: python tools/portal/check.py
      - name: Verify immutable external document evidence
        if: github.event_name != 'pull_request'
        run: python tools/portal/check.py --external
      - name: Keep comparison and candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-portal-comparison-${{ github.sha }}
          path: |
            build/pages-mkdocs
            build/pages-zensical
            build/comparison.json
          if-no-files-found: error
          retention-days: 30
      - name: Package the chosen candidate for Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages-${{ inputs.builder || 'zensical' }}

  deploy:
    needs: compare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: document-portal-pages
      cancel-in-progress: false
    steps:
      - name: Check the Pages source and that this commit is still the newest
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          head="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          deploy=true
          if [ "$build_type" != workflow ]; then
            deploy=false
            echo "::warning::The Pages source is '${build_type}', not GitHub Actions: nothing was deployed."
          elif [ "$head" != "$GITHUB_SHA" ]; then
            deploy=false
            echo "::notice::${DEFAULT_BRANCH} has moved to ${head}: this run (${GITHUB_SHA}) is not deployed; the newer run publishes."
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
      - name: Deploy the complete candidate
        id: deployment
        if: steps.source.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the published website and portal
        if: steps.source.outputs.deploy == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILDER: ${{ inputs.builder || 'zensical' }}
        run: |
          search=documentation/search.json
          if [ "$BUILDER" = mkdocs ]; then search=documentation/search/search_index.json; fi
          for path in "" assets/site.css docs/PORTFOLIO_STATUS.md documentation/ documentation/engines/saccr/ "$search"; do
            curl --fail --silent --show-error --location --output /dev/null \
              --retry 5 --retry-all-errors --retry-delay 10 --max-time 60 "${PAGE_URL}${path}"
            echo "OK ${PAGE_URL}${path}"
          done
