# Proposes updates to the SHA-pinned GitHub Actions used by the workflows,
# the pinned configuration parser in .github/requirements.txt, and the
# hash-locked Python files in tools/: the quality tools
# (requirements-quality-ci.txt) and the documentation portal's builders
# (requirements-portal.txt, compiled from requirements-portal.in). Every update
# arrives as a pull request for maintainer review; nothing merges
# automatically. target-branch must name the active release branch in
# GOVERNANCE.md; update it when a new release branch is opened.
# Each entry waits 14 days after a release before proposing it (cooldown);
# Dependabot security updates are separate and are not delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/1.2.0
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 14
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github
    target-branch: release/1.2.0
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 14
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    groups:
      configuration-parser:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /tools
    target-branch: release/1.2.0
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 14
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    groups:
      python-quality-tools:
        patterns:
          - "*"
